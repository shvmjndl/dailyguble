<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="Today's edition of {{TITLE}}.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{TITLE}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="Today's paper: turn the pages, read the stories, play the puzzles.">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#231f1a">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Guble">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{FONTS}}" data-fonts="{{FONTLIST}}">
<link rel="stylesheet" href="/paper.css">
{{NEWS_PRELOAD}}
<script src="/paper.js" defer fetchpriority="high"></script>
</head>
<body>
<script type="application/json" id="issue-data">{{ISSUE}}</script>

</body>
</html>

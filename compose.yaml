services:
  web:
    build: .
    image: daily-guble:latest
    restart: unless-stopped
    env_file: .env
    ports:
      # Only reachable from this machine. Put HTTPS in front (the "https"
      # profile below, or your own proxy) before exposing it to the internet.
      - "127.0.0.1:8080:8080"
    volumes:
      - guble-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100

  # Optional automatic HTTPS with Let's Encrypt:
  #   docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

volumes:
  guble-data:
  caddy-data:
  caddy-config:
